<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Agriculture - Crop Recommendation</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body  {
            min-height: 100vh;
            background: #f4f8f3;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4caf50;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4caf50;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #388e3c;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            text-align: center;
            background: #eef8ee;
            border-radius: 10px;
        }

        .result h2 {
            margin-bottom: 8px;
        }

        .crop {
            font-size: 28px;
            font-weight: bold;
            color: #388e3c;
            text-transform: capitalize;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🌱 Smart Agriculture</h1>
            <p>AI-Based Crop Recommendation System</p>
        </div>

        <form method="POST">

            <div class="form-grid">

                <div class="input-group">
                    <label>Nitrogen (N)</label>
                    <input type="number" step="any" name="N" required>
                </div>

                <div class="input-group">
                    <label>Phosphorus (P)</label>
                    <input type="number" step="any" name="P" required>
                </div>

                <div class="input-group">
                    <label>Potassium (K)</label>
                    <input type="number" step="any" name="K" required>
                </div>

                <div class="input-group">
                    <label>Temperature (°C)</label>
                    <input type="number" step="any" name="temperature" required>
                </div>

                <div class="input-group">
                    <label>Humidity (%)</label>
                    <input type="number" step="any" name="humidity" required>
                </div>

                <div class="input-group">
                    <label>Soil pH</label>
                    <input type="number" step="any" name="ph" required>
                </div>

                <div class="input-group">
                    <label>Rainfall (mm)</label>
                    <input type="number" step="any" name="rainfall" required>
                </div>

            </div>

            <button type="submit">Recommend Crop 🌾</button>

        </form>
      
{% if prediction %}
<div class="result">
    <h2>🌱 Your Recommended Crop</h2>
    <div class="crop">
        {{ prediction | title }}
    </div>
    <p>
        Recommendation generated using your soil
        nutrients and weather parameters.
    </p>
    <button type="button" onclick="window.location.href='/'">
        Try Another Prediction
    </button>
</div>
{% endif %}

    </div>

</body>
</html>
